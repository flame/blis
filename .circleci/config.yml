version: 2.1

branches:
  only:
    - master
    - dev
    - amd
    - /r[0-9]+.x/
    - cmake-port

orbs:
  win: circleci/windows@5.1.0

executors:
  linux: # Docker using the Base Convenience Image
    docker:
      - image: cimg/base:2024.10
  linuxnew: # Docker using the Base Convenience Image
    docker:
      - image: cimg/base:current-22.04
  linuxnoble: # Docker using Ubuntu 24.04 for newer cross-architecture tooling
    docker:
      - image: cimg/base:current-24.04
  macos: &macos-executor # macos executor running Xcode
    macos:
      xcode: 16.4.0
  linuxvm: # executor type
    machine:
      image: ubuntu-2204:current

workflows:
  build:
    jobs:
      # Default:
      # - win-build:
      #     CC: gcc
      #     TEST: FAST
      #     THR: none
      #     CONF: auto
      #     LIB_TYPE: shared

      - win-build:
          CC: gcc
          THR: openmp,pthreads
          LIB_TYPE: static
          CONF: x86_64

      - win-build:
          CC: clang
          THR: openmp,pthreads
          LIB_TYPE: shared
          CONF: x86_64

      # Default:
      # - build:
      #     os: linux
      #     CC: gcc
      #     OOT: 0
      #     TEST: FAST
      #     SDE: 0
      #     LEVEL0: 0
      #     THR: none
      #     CONF: auto
      #     BLD: ''
      #     LDFLAGS: ''
      #     TESTSUITE_WRAPPER: ''
      #     PACKAGES: ''

      # full testsuite (all tests + mixed datatype (gemm_nn only) + salt + OOT)
      - build:
          OOT: 1
          TEST: ALL
          THR: openmp,pthreads
          CONF: x86_64

      # SDE testing for x86_64
      # Also test LEVEL0 here because g++ uses tons of memory for test_taxpbys.cxx
      - build:
          # linuxvm must be used because it provides 8G RAM and SDE fails with 4G RAM
          os: linuxvm
          SDE: 1
          LEVEL0: 1
          CONF: x86_64

      # test generic kernels
      - build:
          CONF: generic_broadcast

      # clang build
      - build:
          CC: clang
          THR: openmp,pthreads
          CXX: clang++
          PACKAGES: clang libomp-dev

      # nvc build
      - build:
          CC: nvc
          THR: openmp,pthreads
          CXX: nvc++
          PACKAGES: nvhpc-25-7

      # macOS with system compiler (clang)
      - build:
          os: macos
          THR: pthreads
          CC: clang
          CXX: clang++

      # cortexa15 build and fast testsuite (qemu)
      - build:
          CC: arm-linux-gnueabihf-gcc
          CXX: arm-linux-gnueabihf-g++
          CONF: cortexa15
          PACKAGES: 'gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-system-arm qemu-user'
          TESTSUITE_WRAPPER: 'qemu-arm -cpu cortex-a15 -L /usr/arm-linux-gnueabihf/'

      # cortexa57 build and fast testsuite (qemu)
      - build:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          CONF: cortexa57
          PACKAGES: 'gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross qemu-system-arm qemu-user'
          TESTSUITE_WRAPPER: 'qemu-aarch64 -L /usr/aarch64-linux-gnu/'

      # Apple M1 (firestorm) build and fast testsuite (qemu)
      - build:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          CONF: firestorm
          PACKAGES: 'gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross qemu-system-arm qemu-user'
          TESTSUITE_WRAPPER: 'qemu-aarch64 -L /usr/aarch64-linux-gnu/'

      # armsve build and fast testsuite (qemu)
      - build:
          CC: aarch64-linux-gnu-gcc-10
          CXX: aarch64-linux-gnu-g++-10
          CONF: armsve
          PACKAGES: 'gcc-10-aarch64-linux-gnu g++-10-aarch64-linux-gnu libc6-dev-arm64-cross qemu-system-arm qemu-user'
          TESTSUITE_WRAPPER: 'qemu-aarch64 -cpu max,sve=true,sve512=true -L /usr/aarch64-linux-gnu/'

      # arm64 build and fast testsuite (qemu)
      # NOTE: This entry omits the -cpu flag so that while both NEON and SVE kernels
      # are compiled, only NEON kernels will be tested. (h/t to RuQing Xu)
      - build:
          CC: aarch64-linux-gnu-gcc-10
          CXX: aarch64-linux-gnu-g++-10
          CONF: arm64
          PACKAGES: 'gcc-10-aarch64-linux-gnu g++-10-aarch64-linux-gnu libc6-dev-arm64-cross qemu-system-arm qemu-user'
          TESTSUITE_WRAPPER: 'qemu-aarch64 -L /usr/aarch64-linux-gnu/'

      # IBM z15 build and fast testsuite (qemu)
      - build:
          os: linuxnoble
          CC: s390x-linux-gnu-gcc
          CXX: s390x-linux-gnu-g++
          CONF: z15
          PACKAGES: 'gcc-s390x-linux-gnu g++-s390x-linux-gnu libc6-dev-s390x-cross qemu-user'
          TESTSUITE_WRAPPER: 'qemu-s390x -cpu max -L /usr/s390x-linux-gnu/'

      # The RISC-V targets require the qemu version available in jammy or newer.
      # When CI is upgraded, the packages should be activated and do_script.sh
      # cleaned up.
      # PACKAGES="qemu-user qemu-user-binfmt"
      - build:
          CONF: rv64iv
          BLD: --disable-shared
          LDFLAGS: -static
      - build:
          CONF: rv32iv
          BLD: --disable-shared
          LDFLAGS: -static
      - build:
          CONF: sifive_x280
          BLD: --disable-shared
          LDFLAGS: -static

      # ---- CMake CI, ported 1:1 from .github/workflows/cmake.yml ----
      # Linux gcc/clang x {single,openmp,pthreads}, with install and consumer checks
      - cmake-linux:
          name: cmake-linux-gcc-single
          cc: gcc
          thr: single
      - cmake-linux:
          name: cmake-linux-gcc-openmp
          cc: gcc
          thr: openmp
      - cmake-linux:
          name: cmake-linux-gcc-pthreads
          cc: gcc
          thr: pthreads
      - cmake-linux:
          name: cmake-linux-clang-single
          cc: clang
          thr: single
      - cmake-linux:
          name: cmake-linux-clang-openmp
          cc: clang
          thr: openmp
      - cmake-linux:
          name: cmake-linux-clang-pthreads
          cc: clang
          thr: pthreads

      # 5 config jobs
      - cmake-linux-config:
          name: cmake-linux-config-auto
          config: auto
      - cmake-linux-config:
          name: cmake-linux-config-x86_64
          config: x86_64
      - cmake-linux-config:
          name: cmake-linux-config-zen3
          config: zen3
      - cmake-linux-config:
          name: cmake-linux-config-sandybridge
          config: sandybridge
      - cmake-linux-config:
          name: cmake-linux-config-generic
          config: generic

      # s390x under qemu
      - cmake-linux-s390x-z15

      # macOS, Apple clang (no OpenMP)
      - cmake-macos:
          name: cmake-macos-single
          thr: single
      - cmake-macos:
          name: cmake-macos-pthreads
          thr: pthreads

      # Windows
      - cmake-windows-ucrt64-gcc
      - cmake-windows-clang-msvc
      - cmake-windows-clang-cl

jobs:
  win-build:
    parameters:
      CC:
        type: string
        default: gcc
      CXX:
        type: string
        default: g++
      TEST:
        type: string
        default: FAST
      THR:
        type: string
        default: none
      CONF:
        type: string
        default: auto
      LIB_TYPE:
        type: string
        default: shared
    executor:
      name: win/default
    steps:
      - run: git config --global core.autocrlf input

      - checkout

      - run:
          name: Installing Dependencies
          command: |
            choco install mingw llvm
      - run:
          name: Configuring, Building, Testing
          command: |
            $env:DIST_PATH = "."
            $env:CC = "<< parameters.CC >>"
            $env:PATH = "$env:PATH;C:\Users\circleci\project\blis\lib"
            $env:CXX = "<< parameters.CXX >>"
            $CONF = "<< parameters.CONF >>"
            $TEST = "<< parameters.TEST >>"
            $THR = "<< parameters.THR >>"
            $LIB_TYPE = "<< parameters.LIB_TYPE >>"
            $CBLAS = "no"
            $SANDBOX = "no"

            echo "DIST_PATH = $env:DIST_PATH"
            echo "CC        = $env:CC"
            echo "CXX       = $env:CXX"
            echo "CONF      = $CONF"
            echo "TEST      = $TEST"
            echo "THR       = $THR"
            echo "LIB_TYPE  = $LIB_TYPE"

            if ($CC -eq "clang") { $AR = "llvm-ar" }
            if ($CC -eq "clang") { $AS = "llvm-as" }
            if ($LIB_TYPE -eq "shared") { $CONFIGURE_OPTS = "$CONFIGURE_OPTS --enable-shared --disable-static" }
            if ($LIB_TYPE -eq "static") { $CONFIGURE_OPTS = "$CONFIGURE_OPTS --disable-shared --enable-static" }
            if ($CBLAS -ne "no") { $CONFIGURE_OPTS = "$CONFIGURE_OPTS --enable-cblas" }
            if ($SANDBOX -eq "yes") { $CONFIGURE_OPTS = "$CONFIGURE_OPTS -s gemmlike" }
            $env:RANLIB = "echo"
            $env:LIBPTHREAD = ""

            $CONFIGURE_OPTS = "$CONFIGURE_OPTS --enable-threading=$THR --enable-arg-max-hack --prefix=/c/Users/circleci/project/blis $CONF"
            echo "Configuring with: $CONFIGURE_OPTS"
            bash -lc "./configure $CONFIGURE_OPTS"
            echo "config.mk"
            cat config.mk
            echo "bli_config.h"
            cat bli_config.h

            bash -lc "mingw32-make -j4 V=1"
            bash -lc "mingw32-make install"

            if ($LIB_TYPE -eq "shared") { $TEST_TARGET = "checkblis-fast" }
            if ($LIB_TYPE -eq "static") { $TEST_TARGET = "check" }
            echo "Test target: $TEST_TARGET"
            if ($TEST -eq "FAST") { bash -lc "mingw32-make $TEST_TARGET -j4 T=1 V=1" }

            tar zcvf blis-x86_64-win-$LIB_TYPE.tar.gz blis

            Select-String -Path output.testsuite -Pattern "Exiting normally" -SimpleMatch
            Select-String -Path output.testsuite -Pattern "FAILURE" -CaseSensitive -SimpleMatch

            if ((-not (Select-String -Path output.testsuite -Pattern "Exiting normally" -SimpleMatch -Quiet)) -or
                (Select-String -Path output.testsuite -Pattern "FAILURE" -SimpleMatch -CaseSensitive -Quiet))
            {
                throw "Build and/or tests failed."
            }

      - store_artifacts:
          path: blis-x86_64-win-<< parameters.LIB_TYPE >>.tar.gz

      - store_artifacts:
          path: output.testsuite

  build:
    parameters:
      os:
        type: executor
        default: linux
      CC:
        type: string
        default: gcc
      CXX:
        type: string
        default: g++
      OOT:
        type: integer
        default: 0
      TEST:
        type: string
        default: FAST
      SDE:
        type: integer
        default: 0
      LEVEL0:
        type: integer
        default: 0
      THR:
        type: string
        default: none
      CONF:
        type: string
        default: auto
      BLD:
        type: string
        default: ''
      LDFLAGS:
        type: string
        default: ''
      TESTSUITE_WRAPPER:
        type: string
        default: ''
      PACKAGES:
        type: string
        default: ''
    executor: << parameters.os >>
    steps:
      - checkout

      - when:
          condition:
            not:
              equal: [ *macos-executor, << parameters.os >> ]
          steps:
            - run:
                name: Installing Dependencies
                command: |
                  export CC="<< parameters.CC >>"
                  if [ $CC = nvc ]; then
                    curl https://developer.download.nvidia.com/hpc-sdk/ubuntu/DEB-GPG-KEY-NVIDIA-HPC-SDK | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg
                    echo 'deb [signed-by=/usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg] https://developer.download.nvidia.com/hpc-sdk/ubuntu/amd64 /' | sudo tee /etc/apt/sources.list.d/nvhpc.list
                  fi
                  sudo apt-get update && sudo NEEDRESTART_MODE=a apt-get install -y make python3 << parameters.PACKAGES >>

      - run:
          name: Configuring, Building, Testing
          command: |
            export DIST_PATH=.
            export CC="<< parameters.CC >>"
            export CXX="<< parameters.CXX >>"
            export OOT="<< parameters.OOT >>"
            export CONF="<< parameters.CONF >>"
            export TEST="<< parameters.TEST >>"
            export BLD="<< parameters.BLD >>"
            export LDFLAGS="<< parameters.LDFLAGS >>"
            export SDE="<< parameters.SDE >>"
            export LEVEL0="<< parameters.LEVEL0 >>"
            export THR="<< parameters.THR >>"
            export TESTSUITE_WRAPPER="<< parameters.TESTSUITE_WRAPPER >>"

            pwd
            if [ $OOT -eq 1 ]; then export DIST_PATH=`pwd`; mkdir ../oot; cd ../oot; chmod -R a-w $DIST_PATH; fi
            pwd

            if [ $CC = nvc ];then
              NVARCH=`uname -s`_`uname -m`; export NVARCH
              NVCOMPILERS=/opt/nvidia/hpc_sdk; export NVCOMPILERS
              MANPATH=$MANPATH:$NVCOMPILERS/$NVARCH/25.7/compilers/man; export MANPATH
              PATH=$NVCOMPILERS/$NVARCH/25.7/compilers/bin:$PATH; export PATH
              export FC=nvfortran
            fi

            if [ "$CONF" = "rv64iv" ]; then
              $DIST_PATH/ci/do_riscv.sh "$CONF";
              export CC=$DIST_PATH/../toolchain/riscv/bin/riscv64-unknown-linux-gnu-gcc;
              export CXX=$DIST_PATH/../toolchain/riscv/bin/riscv64-unknown-linux-gnu-g++;
              export TESTSUITE_WRAPPER="$DIST_PATH/../toolchain/qemu-riscv64 -cpu rv64,vext_spec=v1.0,v=true,vlen=128 -B 0x100000";
            fi
            if [ "$CONF" = "rv32iv" ]; then
              $DIST_PATH/ci/do_riscv.sh "$CONF";
              export CC=$DIST_PATH/../toolchain/riscv/bin/riscv32-unknown-linux-gnu-gcc;
              export CXX=$DIST_PATH/../toolchain/riscv/bin/riscv32-unknown-linux-gnu-g++;
              export TESTSUITE_WRAPPER="$DIST_PATH/../toolchain/qemu-riscv32 -cpu rv32,vext_spec=v1.0,v=true,vlen=128 -B 0x100000";
            fi
            if [ "$CONF" = "sifive_x280" ]; then
              $DIST_PATH/ci/do_riscv.sh "$CONF";
              export CC=$DIST_PATH/../toolchain/riscv/bin/clang;
              export CXX=$DIST_PATH/../toolchain/riscv/bin/clang++;
              export TESTSUITE_WRAPPER="$DIST_PATH/../toolchain/qemu-riscv64 -cpu rv64,vext_spec=v1.0,v=true,vlen=512 -B 0x100000";
            fi

            if [ "$CONF" = "generic_broadcast" ]; then
              export CONF=generic
              export CFLAGS="-DBLIS_BBM_s=2 -DBLIS_BBM_d=2 -DBLIS_BBM_c=2 -DBLIS_BBM_z=2 -DBLIS_BBN_s=4 -DBLIS_BBN_d=4 -DBLIS_BBN_c=4 -DBLIS_BBN_z=4"
            fi

            echo "Configuration:"
            echo "CC                = $CC"
            echo "CXX               = $CXX"
            echo "OOT               = $OOT"
            echo "CONF              = $CONF"
            echo "THR               = $THR"
            echo "TEST              = $TEST"
            echo "BLD               = $BLD"
            echo "SDE               = $SDE"
            echo "LEVEL0            = $LEVEL0"
            echo "DIST_PATH         = $DIST_PATH"
            echo "CFLAGS            = $CFLAGS"
            echo "LDFLAGS           = $LDFLAGS"
            echo "TESTSUITE_WRAPPER = $TESTSUITE_WRAPPER"

            $DIST_PATH/configure -p `pwd`/../install -t $THR $BLD CC=$CC $CONF
            pwd
            ls -l
            $CC --version
            $CC -v
            echo "config.mk"
            cat config.mk
            echo "bli_config.h"
            cat bli_config.h

            make V=1 -j2
            make install

            if [ "$BLD" = "" ] && [ "$TESTSUITE_WRAPPER" = "" ] ; then $DIST_PATH/ci/cxx/cxx-test.sh $DIST_PATH $(ls -1 include); fi
            # Qemu SVE is failing sgemmt in some cases. Skip as this issue is not observed
            # on real chip (A64fx).
            if [ "$CONF" = "armsve" ]; then sed -i 's/.*\<gemmt\>.*/0/' $DIST_PATH/testsuite/input.operations.fast; fi
            if [ "$TEST" != "0" ]; then $DIST_PATH/ci/do_testsuite.sh; fi
            if [ "$SDE" = "1" ]; then $DIST_PATH/ci/do_sde.sh; fi
            if [ "$LEVEL0" = "1" ]; then $DIST_PATH/ci/do_level0.sh; fi

      - store_artifacts:
          path: output.testsuite

  # ---- CMake CI, ported 1:1 from .github/workflows/cmake.yml ----
  # Linux gcc/clang x {single,openmp,pthreads}: build, test, install, consumers.
  cmake-linux:
    parameters:
      cc:
        type: string
      thr:
        type: string
    executor: linuxnoble
    steps:
      - checkout

      - run:
          name: Install build tools
          command: |
            export CC=<< parameters.cc >>
            echo "export CC=$CC" >> "$BASH_ENV"
            if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq gcc g++ clang libomp-dev ninja-build python3-pip

      - run:
          name: Install cmake 4 with pip when the image provides an older cmake
          command: |
            v=$(cmake --version 2>/dev/null | head -1 || true)
            case "$v" in
              "cmake version 4"*) ;;
              *) python3 -m pip install --user --quiet --break-system-packages cmake
                 echo "export PATH=$(python3 -m site --user-base)/bin:\$PATH" >> "$BASH_ENV"
                 ;;
            esac

      - run:
          name: OpenMP runtime for clang (libomp; not covered by setup-cpp)
          command: |
            if [ "<< parameters.cc >>" = clang ] && [ "<< parameters.thr >>" = openmp ]; then
              if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
              # setup-cpp's llvm and ubuntu's libomp-dev differ in version; omp.h
              # lives in the clang resource dir of the matching libomp-*-dev.
              $SUDO apt-get update -qq && $SUDO apt-get install -y -qq "libomp-$($CC -dumpversion | cut -d. -f1)-dev"
            fi

      - run:
          name: Configure
          command: |
            cmake -S . -B _build -G Ninja \
              -DBLIS_CONFIG=haswell -DBLIS_THREADING='<< parameters.thr >>' \
              -DCMAKE_INSTALL_PREFIX="$PWD/_install"

      - run:
          name: Build
          command: cmake --build _build -j 4

      - run:
          name: Test (BLIS testsuite, fast)
          command: ctest --test-dir _build -R blis-test-fast --output-on-failure

      - run:
          name: Test (reference BLAS drivers)
          command: ctest --test-dir _build -L blastest --output-on-failure

      - run:
          name: Install
          command: cmake --install _build

      - run:
          name: Consumer via find_package
          command: |
            cat >main.c \<<'EOF'
            #include "blis.h"
            int main(void){ return bli_info_get_version_str() == 0; }
            EOF
            mkdir -p consumer && mv main.c consumer/main.c
            cat >consumer/CMakeLists.txt \<<'EOF'
            cmake_minimum_required(VERSION 3.20...4.4)
            project(consumer C)
            find_package(blis REQUIRED)
            add_executable(c main.c)
            target_link_libraries(c PRIVATE blis::blis)
            EOF
            cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/_install"
            cmake --build consumer/build
            LD_LIBRARY_PATH="$PWD/_install/lib" ./consumer/build/c

      - run:
          name: Consumer via pkg-config
          command: |
            export PKG_CONFIG_PATH="$PWD/_install/share/pkgconfig"
            cc $(pkg-config --cflags blis) consumer/main.c \
               $(pkg-config --libs blis) -lm -o consumer/pc
            LD_LIBRARY_PATH="$PWD/_install/lib" ./consumer/pc

      - run:
          name: Standalone testsuite against installed package
          command: |
            cmake -S testsuite -B ts-build -G Ninja \
              -DCMAKE_PREFIX_PATH="$PWD/_install"
            cmake --build ts-build
            (cd testsuite && ../ts-build/test_libblis.x \
              -g input.general.fast -o input.operations.fast > ../output.testsuite)
            grep -q 'Exiting normally' output.testsuite
            ! grep -q FAILURE output.testsuite

  # 5 BLIS_CONFIG variants with cblas and fast/mixed tests.
  cmake-linux-config:
    parameters:
      config:
        type: string
    executor: linuxnoble
    steps:
      - checkout

      - run:
          name: Install build tools
          command: |
            if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq gcc g++ clang libomp-dev ninja-build python3-pip

      - run:
          name: Install cmake 4 with pip when the image provides an older cmake
          command: |
            v=$(cmake --version 2>/dev/null | head -1 || true)
            case "$v" in
              "cmake version 4"*) ;;
              *) python3 -m pip install --user --quiet --break-system-packages cmake
                 echo "export PATH=$(python3 -m site --user-base)/bin:\$PATH" >> "$BASH_ENV"
                 ;;
            esac

      - run:
          name: Configure + build
          command: |
            cmake -S . -B _build -G Ninja -DBLIS_CONFIG=<< parameters.config >> \
              -DBLIS_ENABLE_CBLAS=ON
            cmake --build _build -j 4

      - run:
          name: Test (fast)
          command: ctest --test-dir _build -R 'blis-test-(fast|mixed)' --output-on-failure

  # s390x cross build with the same qemu emulator settings as the GitHub job.
  cmake-linux-s390x-z15:
    executor: linuxnoble
    steps:
      - checkout

      - run:
          name: Install build tools + cross toolchain
          command: |
            if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq gcc g++ clang libomp-dev ninja-build python3-pip \
              gcc-s390x-linux-gnu g++-s390x-linux-gnu libc6-dev-s390x-cross qemu-user

      - run:
          name: Install cmake 4 with pip when the image provides an older cmake
          command: |
            v=$(cmake --version 2>/dev/null | head -1 || true)
            case "$v" in
              "cmake version 4"*) ;;
              *) python3 -m pip install --user --quiet --break-system-packages cmake
                 echo "export PATH=$(python3 -m site --user-base)/bin:\$PATH" >> "$BASH_ENV"
                 ;;
            esac

      - run:
          name: Configure
          command: |
            cmake -S . -B _build -G Ninja \
              -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=s390x \
              -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=s390x-linux-gnu-g++ \
              -DCMAKE_CROSSCOMPILING_EMULATOR='qemu-s390x;-cpu;max;-L;/usr/s390x-linux-gnu/' \
              -DCMAKE_FIND_ROOT_PATH=/usr/s390x-linux-gnu \
              -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
              -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
              -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
              -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
              -DBLIS_CONFIG=z15 -DBLIS_ENABLE_CBLAS=ON

      - run:
          name: Build
          command: cmake --build _build -j 4

      - run:
          name: Test (BLIS testsuite, fast)
          command: ctest --test-dir _build -R blis-test-fast --output-on-failure

      - run:
          name: Test (reference BLAS drivers)
          command: ctest --test-dir _build -L blastest --output-on-failure

  # macOS, Apple clang (no bundled OpenMP; single/pthreads only).
  cmake-macos:
    parameters:
      thr:
        type: string
    executor: macos
    steps:
      - checkout

      - run:
          name: Install build tools
          command: |
            command -v ninja >/dev/null || brew install ninja
            v=$(cmake --version 2>/dev/null | head -1 || true)
            case "$v" in
              "cmake version 4"*) ;;
              *) brew install cmake ;;
            esac

      - run:
          name: Configure + build (firestorm = Apple Silicon)
          command: |
            cmake -S . -B _build -G Ninja -DBLIS_CONFIG=firestorm \
              -DBLIS_THREADING='<< parameters.thr >>' -DBLIS_ENABLE_CBLAS=ON
            cmake --build _build -j 4

      - run:
          name: Test (fast)
          command: ctest --test-dir _build -R blis-test-fast --output-on-failure

  # Windows ucrt64 gcc through msys2 (upstream's choco mingw cannot give ucrt64
  # gcc, so msys2 comes from choco; C:\tools\msys64 is its default install dir).
  # The testsuite parser rejects CRLF input files; keep LF as before.
  cmake-windows-ucrt64-gcc:
    executor:
      name: win/default
    steps:
      - run: git config --global core.autocrlf input

      - checkout

      - run:
          name: Installing Dependencies
          command: |
            choco install msys2
            C:\tools\msys64\usr\bin\bash -eo pipefail -c 'export PATH=/usr/bin:/bin:$PATH; pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python'

      - run:
          name: Install cmake 4 with pip when the msys2 cmake is older
          command: |
            C:\tools\msys64\usr\bin\bash -eo pipefail -c 'export PATH=/ucrt64/bin:/usr/bin:/bin:$PATH; v=$(cmake --version 2>/dev/null | head -1 || true); case $v in cmake?version?4*) ;; *) python -m pip install --quiet cmake ;; esac'

      - run:
          name: Configure + build
          command: |
            C:\tools\msys64\usr\bin\bash -eo pipefail -c 'export PATH=/ucrt64/bin:/usr/bin:/bin:$PATH; cmake --version; cmake -S . -B _build -G Ninja -DBLIS_CONFIG=haswell -DBLIS_THREADING=single -DBLIS_ENABLE_CBLAS=ON; cmake --build _build -j 4'

      - run:
          name: Test (fast)
          command: |
            C:\tools\msys64\usr\bin\bash -eo pipefail -c 'export PATH=$PWD/_build/lib:/ucrt64/bin:/usr/bin:/bin:$PATH; ctest --test-dir _build -R blis-test-fast --output-on-failure'

  # Windows + LLVM clang with the MSVC environment (vcvars64), mirroring
  # upstream's AppVeyor Windows-clang flow (clang gnu-driver, windows-msvc
  # target). MSVC's cl itself is not supported by BLIS.
  cmake-windows-clang-msvc:
    executor:
      name: win/default
    steps:
      - run: git config --global core.autocrlf input

      - checkout

      - run:
          name: Setup C/C++ toolchain (llvm clang + msvc env + cmake + ninja)
          command: choco install llvm cmake ninja

      - run:
          name: Configure + build
          command: |
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
            if (-not $vs) { Write-Error "vcvars64: no Visual Studio with the C++ toolset found"; exit 1 }
            @"
            @echo off
            call "$vs\VC\Auxiliary\Build\vcvars64.bat" >nul 2>&1 || exit /b 1
            where clang || exit /b 1
            clang --version || exit /b 1
            set "CC=clang"
            cmake -S . -B _build -G Ninja -DBLIS_CONFIG=haswell -DBLIS_THREADING=single -DBLIS_ENABLE_CBLAS=ON -DCMAKE_C_COMPILER=clang || exit /b 1
            cmake --build _build -j 4 || exit /b 1
            "@ | Set-Content -Path _step.cmd -Encoding ascii
            cmd /c _step.cmd
            exit $LASTEXITCODE

      - run:
          name: Test (fast)
          command: |
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
            if (-not $vs) { Write-Error "vcvars64: no Visual Studio with the C++ toolset found"; exit 1 }
            @"
            @echo off
            call "$vs\VC\Auxiliary\Build\vcvars64.bat" >nul 2>&1 || exit /b 1
            set "PATH=%CD%\_build\lib;%PATH%"
            ctest --test-dir _build -R blis-test-fast --output-on-failure || exit /b 1
            "@ | Set-Content -Path _step.cmd -Encoding ascii
            cmd /c _step.cmd
            exit $LASTEXITCODE

  # clang-cl: cl-compatible driver with clang code-gen. Not covered by
  # upstream CI; flags are accepted as verified against clang-18's clang-cl
  # driver. MSVC's own cl is unsupported (as in upstream BLIS).
  cmake-windows-clang-cl:
    executor:
      name: win/default
    steps:
      - run: git config --global core.autocrlf input

      - checkout

      - run:
          name: Setup C/C++ toolchain (llvm, msvc env, cmake, ninja)
          command: choco install llvm cmake ninja

      - run:
          name: Configure + build
          command: |
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
            if (-not $vs) { Write-Error "vcvars64: no Visual Studio with the C++ toolset found"; exit 1 }
            @"
            @echo off
            call "$vs\VC\Auxiliary\Build\vcvars64.bat" >nul 2>&1 || exit /b 1
            where clang-cl || exit /b 1
            cmake -S . -B _build -G Ninja -DBLIS_CONFIG=haswell -DBLIS_THREADING=single -DBLIS_ENABLE_CBLAS=ON -DCMAKE_C_COMPILER=clang-cl || exit /b 1
            cmake --build _build -j 4 || exit /b 1
            "@ | Set-Content -Path _step.cmd -Encoding ascii
            cmd /c _step.cmd
            exit $LASTEXITCODE

      - run:
          name: Test (fast)
          command: |
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
            if (-not $vs) { Write-Error "vcvars64: no Visual Studio with the C++ toolset found"; exit 1 }
            @"
            @echo off
            call "$vs\VC\Auxiliary\Build\vcvars64.bat" >nul 2>&1 || exit /b 1
            set "PATH=%CD%\_build\lib;%PATH%"
            ctest --test-dir _build -R blis-test-fast --output-on-failure || exit /b 1
            "@ | Set-Content -Path _step.cmd -Encoding ascii
            cmd /c _step.cmd
            exit $LASTEXITCODE
